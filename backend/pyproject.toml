[project]
name = "white-moon-backend"
version = "0.0.1"
description = "White Moon B2B marketplace + ERP backend (Flask)"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0",
  "flask-sqlalchemy>=3.1",
  "flask-migrate>=4.0",
  "flask-jwt-extended>=4.6",
  "flask-socketio>=5.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "boto3>=1.34",
  "pydantic[email]>=2.6",
  "python-dotenv>=1.0",
  "pytesseract>=0.3",
  "pillow>=10.2",
  "weasyprint>=61",
  "openpyxl>=3.1",
  "twilio>=9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-flask>=1.3",
  "pytest-cov>=5",
  "factory-boy>=3.3",
  "ruff>=0.6",
  "pyright>=1.1",
  "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "ARG", "PL", "RUF"]
ignore = [
  "PLR0913",
  # Flask/HTTP exception types follow the Werkzeug naming (NotFound,
  # BadRequest, …); appending "Error" would be surprising.
  "N818",
  # Lazy imports inside the app factory prevent circular model loads at
  # import time; this is the documented pattern.
  "PLC0415",
  # Arabic-first codebase: "ambiguous" Unicode (Arabic comma, etc.) in
  # strings/docstrings/comments is intentional, not a confusable-char risk.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy __table_args__ dicts and class-level configuration dicts are
# the documented API; the "mutable class attribute" lint doesn't apply.
"app/**/models.py" = ["RUF012"]
# The CoA seed is tabular data; Arabic account names push many lines over
# the width limit but splitting one row across lines would be worse.
"app/accounting/seed.py" = ["E501"]
# Commerce source has dense Arabic-labelled flows; a few lines run long but
# wrapping them hurts readability more than it helps.
"app/commerce/**/*.py" = ["E501"]
# Credit-rule thresholds/weights are the documented business rule (docs/04);
# extracting each literal to a constant hurts more than it helps.
"app/sales/**/*.py" = ["E501", "PLR2004"]
"tests/**/*.py" = ["PLR2004", "S101", "ARG001", "E501"]
"migrations/**/*.py" = ["N999", "E501"]
