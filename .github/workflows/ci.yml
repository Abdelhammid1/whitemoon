name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image: the assistant knowledge base needs the `vector` ext.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wm
          POSTGRES_PASSWORD: wm
          POSTGRES_DB: whitemoon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wm -d whitemoon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://wm:wm@localhost:5432/whitemoon_test
      FLASK_SECRET_KEY: ci
      JWT_SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Type-check
        working-directory: backend
        run: pyright
      - name: Migrate
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Test
        working-directory: backend
        run: pytest

  # Post-deployment knowledge-base reindex (ticket §7). The real reindex runs on
  # the server after a successful deploy (it needs the prod DB + the embeddings
  # model); this job proves the indexing pipeline itself stays green on main and
  # records the version. See docs/22-assistant.md for wiring the server hook.
  assistant-index-smoke:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wm
          POSTGRES_PASSWORD: wm
          POSTGRES_DB: whitemoon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wm -d whitemoon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://wm:wm@localhost:5432/whitemoon_test
      FLASK_SECRET_KEY: ci
      JWT_SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Migrate
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Reindex assistant knowledge base
        working-directory: backend
        run: python scripts/reindex_assistant.py "${{ github.sha }}"
